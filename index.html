<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivia Neon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light text-center">

  <!-- Pantalla de inicio -->
  <div id="setup" class="container mt-5">
    <h1 class="neon-text mb-4">Trivia Neon</h1>
    <div class="mb-3">
      <input id="team1Name" class="form-control text-center" placeholder="Nombre Equipo 1">
    </div>
    <div class="mb-3">
      <input id="team2Name" class="form-control text-center" placeholder="Nombre Equipo 2">
    </div>
    <button id="startBtn" class="btn btn-neon mt-3">Comenzar</button>
  </div>

  <!-- Pantalla de juego -->
  <div id="game" class="container mt-5 d-none">
    <h2 id="turnTitle" class="neon-text mb-4"></h2>

    <div id="wheelContainer" class="my-4">
      <canvas id="wheel" width="300" height="300"></canvas>
      <div>
        <button id="spinBtn" class="btn btn-neon mt-3">Girar Ruleta</button>
      </div>
    </div>

    <div id="scoreBoard" class="mt-5">
      <h4>Puntaje</h4>
      <p id="scoreText"></p>
    </div>
  </div>

  <!-- Modal de pregunta -->
  <div class="modal fade" id="questionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light">
        <div class="modal-header">
          <h5 class="modal-title neon-text" id="modalCategory"></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p id="modalQuestion" class="lead"></p>
          <div id="modalAnswers" class="d-grid gap-2"></div>
          <p id="modalTimer" class="neon-text mt-2"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
